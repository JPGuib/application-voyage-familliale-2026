                }

                .geo-status.is-error {

                }

                .geo-status.is-success {
                    background: rgba(21, 128, 61, 0.9);
                }
            </style>

            <script>
                L_NO_TOUCH = false;
                L_DISABLE_3D = false;
            </script>

        
</head>
<body>
    
    
            <div class="folium-map" id="map_6d6d6aa5c1bac21ae27cc26f447bca46" ></div>
            <div class="geo-ui">
                <button id="geo-locate-btn" class="geo-locate-btn" type="button">Me localiser</button>
                <p id="geo-status" class="geo-status" aria-live="polite">GPS inactif</p>
            </div>
        
</body>
<script>
    
    
            var map_6d6d6aa5c1bac21ae27cc26f447bca46 = L.map(
                "map_6d6d6aa5c1bac21ae27cc26f447bca46",
                {
                    center: [41.0114, 28.9689],
                    crs: L.CRS.EPSG3857,
                    ...{
  "zoom": 18,
  "zoomControl": true,
  "preferCanvas": false,
}

                }
            );

            

        
    
            var tile_layer_868b84c6fc0443e04ff48c424adb4ad8 = L.tileLayer(
                "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
                {
  "minZoom": 0,
  "maxZoom": 19,
  "maxNativeZoom": 19,
  "noWrap": false,
  "attribution": "\u0026copy; \u003ca href=\"https://www.openstreetmap.org/copyright\"\u003eOpenStreetMap\u003c/a\u003e contributors",
  "subdomains": "abc",
  "detectRetina": false,
  "tms": false,
  "opacity": 1,
}

            );
        
    
            tile_layer_868b84c6fc0443e04ff48c424adb4ad8.addTo(map_6d6d6aa5c1bac21ae27cc26f447bca46);
        
    
            var marker_8e0bc3b692dd3d843e027903453b537d = L.marker(
                [41.01139, 28.96917],
                {
}
            ).addTo(map_6d6d6aa5c1bac21ae27cc26f447bca46);
        
    
        var popup_af673e7484c64a75124ddc01d16233b3 = L.popup({
  "maxWidth": "100%",
});

        
            
                var html_0328f2ab7b9471be9d030e76ecea20cc = $(`<div id="html_0328f2ab7b9471be9d030e76ecea20cc" style="width: 100.0%; height: 100.0%;">Zincirli Han (cour intérieure avec arbre)</div>`)[0];
                popup_af673e7484c64a75124ddc01d16233b3.setContent(html_0328f2ab7b9471be9d030e76ecea20cc);
            
        

        marker_8e0bc3b692dd3d843e027903453b537d.bindPopup(popup_af673e7484c64a75124ddc01d16233b3)
        ;

        var geolocationWatchId = null;
        var userMarker = null;
        var userAccuracyCircle = null;
        var shouldCenterOnNextFix = true;
        var geoStatusElement = document.getElementById("geo-status");
        var geoLocateButton = document.getElementById("geo-locate-btn");

        function setGeoStatus(message, tone) {
            if (!geoStatusElement) {
                return;
            }

            geoStatusElement.textContent = message;
            geoStatusElement.classList.remove("is-error", "is-success");

            if (tone === "error") {
                geoStatusElement.classList.add("is-error");
            }

            if (tone === "success") {
                geoStatusElement.classList.add("is-success");
            }
        }

        function updateUserPosition(position) {
            var latitude = position.coords.latitude;
            var longitude = position.coords.longitude;
            var accuracy = position.coords.accuracy || 0;
            var userLatLng = [latitude, longitude];

            if (!userMarker) {
                userMarker = L.circleMarker(userLatLng, {
                    radius: 8,
                    color: "#2563eb",
                    fillColor: "#3b82f6",
                    fillOpacity: 0.95,
                    weight: 2,
                }).addTo(map_6d6d6aa5c1bac21ae27cc26f447bca46);
                userMarker.bindPopup("Vous êtes ici");
            } else {
                userMarker.setLatLng(userLatLng);
            }

            if (!userAccuracyCircle) {
                userAccuracyCircle = L.circle(userLatLng, {
                    radius: accuracy,
                    color: "#3b82f6",
                    fillColor: "#93c5fd",
                    fillOpacity: 0.2,
                    weight: 1,
                }).addTo(map_6d6d6aa5c1bac21ae27cc26f447bca46);
            } else {
                userAccuracyCircle.setLatLng(userLatLng);
                userAccuracyCircle.setRadius(accuracy);
            }

            if (shouldCenterOnNextFix) {
                map_6d6d6aa5c1bac21ae27cc26f447bca46.setView(userLatLng, 18);
                shouldCenterOnNextFix = false;
            }

            setGeoStatus("Position GPS active (precision ~" + Math.round(accuracy) + " m)", "success");
        }

        function handleGeolocationError(error) {
            console.info("Geolocalisation indisponible:", error && error.message ? error.message : error);

            if (!error || typeof error.code !== "number") {
                setGeoStatus("GPS indisponible pour le moment", "error");
                return;
            }

            if (error.code === error.PERMISSION_DENIED) {
                setGeoStatus("GPS refuse. Autorisez la localisation dans le navigateur.", "error");
                return;
            }

            if (error.code === error.POSITION_UNAVAILABLE) {
                setGeoStatus("Position introuvable. Verifiez le signal GPS.", "error");
                return;
            }

            if (error.code === error.TIMEOUT) {
                setGeoStatus("GPS trop lent. Reessayez avec Me localiser.", "error");
                return;
            }

            setGeoStatus("GPS indisponible pour le moment", "error");
        }

        function startGeolocation() {
            if (!("geolocation" in navigator)) {
                setGeoStatus("Geolocalisation non supportee par cet appareil", "error");
                return;
            }

            setGeoStatus("Recherche de votre position GPS...", null);

            if (geolocationWatchId === null) {
                geolocationWatchId = navigator.geolocation.watchPosition(updateUserPosition, handleGeolocationError, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 5000,
                });
            }
        }

        if (geoLocateButton) {
            geoLocateButton.addEventListener("click", function () {
                shouldCenterOnNextFix = true;

                if (userMarker) {
                    map_6d6d6aa5c1bac21ae27cc26f447bca46.setView(userMarker.getLatLng(), 18);
                    setGeoStatus("Recentre sur votre position", "success");
                    return;
                }

                startGeolocation();
            });
        }

        startGeolocation();

        
    
</script>
